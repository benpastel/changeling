<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Changeling</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap">
    <link rel="stylesheet" href="style.css">
    <!-- the theme before anything's drawn (see settings.js) -->
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("arena.theme") === "dark" ? "dark" : "light"; } catch {}</script>
  </head>
  <body class="at-lobby">
    <div class="lobby screen">
      <h1 class="title">Changeling</h1>
      <a class="link how-to" href="how-to-play.html" target="_blank" rel="noreferrer">how to play</a>
      <input class="name-input" maxlength="20" spellcheck="false" autocomplete="off" placeholder="your name" aria-label="Your name">
      <div class="lobby-actions">
        <button class="btn primary new-table" disabled>new table</button>
        <button class="btn play-bot" disabled>play the bot</button>
      </div>
      <div class="table-list" hidden></div>
    </div>
    <div class="room screen"></div>
    <div class="container">
      <div class="sidebar lists">
        <div class="sidebar-top">
          <span class="area-label">piece info</span>
          <div class="in-play"></div>
          <div class="smite-cost">
            <span class="option shell"><span class="symbol"><span>⚡</span></span></span>
            <span class="cost"></span>
          </div>
        </div>
        <div class="acc">
          <div class="acc-row"><span class="acc-label">graveyard</span><span class="acc-tiles graveyard-contents"></span></div>
          <div class="acc-row"><span class="acc-label">unused</span><span class="acc-tiles unused-contents"></span></div>
          <div class="acc-row"><span class="acc-label">unknown to you</span><span class="acc-tiles hidden-tiles-contents"></span></div>
        </div>
        <div class="quit">
          <span class="option shell"><span class="symbol"><span>✕</span></span></span>
        </div>
      </div>
      <div class="strip top">
        <div class="who"><span class="name"></span><span class="turn-note"></span></div>
        <div class="coins"><span class="amount"></span><span class="clock"><span class="allowance"></span><span class="reserve"></span></span></div>
        <div class="hand"><span class="area-label">hand</span><div class="hand-tiles"></div></div>
      </div>
      <div class="board"></div>
      <div class="strip bottom">
        <div class="who"><span class="name"></span><span class="turn-note"></span></div>
        <div class="coins"><span class="amount"></span><span class="clock"><span class="allowance"></span><span class="reserve"></span></span></div>
        <div class="hand"><span class="area-label">hand</span><div class="hand-tiles"></div></div>
      </div>
      <div class="side">
        <span class="area-label">history</span>
        <div class="log"></div>
      </div>
    </div>
    <div class="rules" hidden>
      <div class="rules-panel">
        <span class="option shell rules-close"><span class="symbol"><span>✕</span></span></span>
        <div class="rules-list"></div>
      </div>
    </div>
    <div class="result" hidden>
      <div class="result-panel">
        <h2 class="result-title"></h2>
        <table class="result-table"></table>
        <div class="result-actions">
          <button class="btn primary next-game">next game</button>
          <button class="btn back-to-table">back to table</button>
        </div>
      </div>
    </div>
    <button class="settings-button">settings</button>
    <div class="settings" hidden></div>
    <div class="netbar" hidden></div>
    <div class="toast" hidden></div>
    <script src="main.js" type="module"></script>
  </body>
</html>
